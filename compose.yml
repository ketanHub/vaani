services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: vaani
      POSTGRES_USER: vaani
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaani_local_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaani -d vaani"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      VAANI_ENVIRONMENT: development
      VAANI_DATABASE_URL: postgresql+asyncpg://vaani:${POSTGRES_PASSWORD:-vaani_local_dev_only}@postgres:5432/vaani
      VAANI_REDIS_URL: redis://redis:6379/0
      VAANI_REDIS_ENABLED: "true"
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
