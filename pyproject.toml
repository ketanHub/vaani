[project]
name = "vaani"
version = "0.1.0"
description = "Multi-lingual voice AI receptionist for Indian businesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
voice-local = [
    "av>=11,<19",
    "faster-whisper==1.2.1",
    "piper-tts==1.8.0",
]
voice-gpu = [
    "nvidia-cublas-cu12>=12,<13",
    "nvidia-cudnn-cu12>=9,<10",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1.0",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
